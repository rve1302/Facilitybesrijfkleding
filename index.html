<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facility × RVE Bedrijfskleding — Demo</title>
  <style>
:root{
  --ink:#111318;
  --paper:#f6f3ee;
  --white:#ffffff;
  --gold:#a58a4a;
  --gold-dark:#7f6935;
  --gold-soft:#d8c89e;
  --line:#e5ded1;
  --muted:#6f716f;
  --success:#4d8a59;
  --danger:#b65e57;
  --shadow:0 16px 40px rgba(17,19,24,.08);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(246,243,238,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1240px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:inline-flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.03em}
.logo-box{background:#090909;color:#d8c18a;border:2px solid #8d7742;padding:8px 13px;font-size:24px;line-height:1;box-shadow:inset 0 0 0 2px #0d0d0d}
.brand small{font-weight:700;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav button,.ghost{border:none;background:transparent;padding:10px 12px;border-radius:12px;color:#282a2e}
.nav button:hover,.nav button.active,.ghost:hover{background:#ece6db}
.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;transition:.2s ease}
.btn.primary{background:var(--gold);color:#fff}.btn.primary:hover{background:var(--gold-dark)}
.btn.dark{background:#121418;color:#fff}.btn.outline{background:#fff;border:1px solid var(--line)}
.container{max-width:1240px;margin:auto;padding:28px 24px 64px}
.hero{background:linear-gradient(135deg,#151618 0%,#2a2a27 56%,#74613b 100%);min-height:460px;border-radius:30px;overflow:hidden;position:relative;color:#fff;box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(4px);opacity:.45}.hero:before{width:430px;height:430px;background:radial-gradient(circle,#b59a59 0%,rgba(181,154,89,0) 72%);right:-70px;top:-110px}.hero:after{width:360px;height:360px;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 68%);right:120px;bottom:-220px;opacity:.12}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;min-height:460px}
.hero-copy{padding:64px 58px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#d8c18a;font-weight:900;font-size:12px}
h1{font-size:clamp(40px,5vw,72px);line-height:.98;margin:12px 0 18px;max-width:760px;letter-spacing:-.045em}
.hero p{font-size:18px;line-height:1.6;color:#efece7;max-width:620px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.hero-art{position:relative;min-height:380px;display:flex;align-items:end;justify-content:center;padding:34px}
.person-card{width:min(420px,92%);height:340px;border-radius:30px 30px 12px 12px;background:linear-gradient(180deg,#e7e0d4,#b9ab91);position:relative;overflow:hidden;box-shadow:0 24px 45px rgba(0,0,0,.3)}
.person-card:before{content:"";position:absolute;inset:22px 62px 0;border-radius:130px 130px 28px 28px;background:linear-gradient(180deg,#2b2d30,#121315);box-shadow:0 -18px 0 #1e2023 inset}
.person-card:after{content:"FACILITY.";position:absolute;left:50%;transform:translateX(-50%);top:118px;background:#111;color:#d8c18a;border:1px solid #8d7742;padding:6px 9px;font-size:13px;font-weight:900;letter-spacing:.04em}
.hero-tag{position:absolute;right:24px;bottom:22px;background:rgba(255,255,255,.93);color:#111;padding:18px;border-radius:18px;max-width:220px;box-shadow:var(--shadow);font-weight:700}
.feature-strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.feature{padding:22px;display:flex;gap:14px;align-items:center;border-right:1px solid var(--line)}.feature:last-child{border-right:none}.feature .ico{font-size:26px}.feature b{display:block}.feature span{font-size:13px;color:var(--muted)}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:52px 0 18px}.section-title h2{margin:0;font-size:32px;letter-spacing:-.03em}.section-title p{margin:0;color:var(--muted)}
.grid{display:grid;gap:18px}.grid.cols-2{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(3,1fr)}.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 26px rgba(0,0,0,.04);padding:22px}.card h3{margin:0 0 8px}.muted{color:var(--muted)}
.kpi{font-size:34px;font-weight:900;letter-spacing:-.04em}.label{font-size:13px;color:var(--muted);font-weight:700}.mini{font-size:12px;color:var(--muted)}
.progress{height:10px;background:#eee9df;border-radius:99px;overflow:hidden;margin-top:12px}.progress > span{display:block;height:100%;background:var(--gold);border-radius:99px}
.app-shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 76px)}
.sidebar{background:#111318;color:#fff;padding:22px 16px;position:sticky;top:76px;height:calc(100vh - 76px)}
.side-logo{margin:4px 8px 24px}.side-logo .logo-box{display:inline-block;font-size:20px}
.side-nav button{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#eaeaea;text-align:left;padding:12px 14px;border-radius:12px;margin:3px 0}.side-nav button:hover,.side-nav button.active{background:#2d2920;color:#f3dfaa}.side-foot{position:absolute;bottom:18px;left:16px;right:16px;color:#aaa;font-size:12px;border-top:1px solid #2e2e2e;padding-top:14px}
.content{padding:30px;max-width:1250px;width:100%}.content-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.content-head h2{margin:0;font-size:34px}.user-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:14px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d9c8a2;font-weight:900}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}.product-img{height:180px;border-radius:15px;background:linear-gradient(145deg,#efebe4,#dad2c6);display:grid;place-items:center;font-size:74px}.product h4{margin:0}.product .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:900;color:var(--gold-dark)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#f9f6f0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6e675a}.status{display:inline-flex;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px;background:#e8f1ea;color:#3f764a}.status.warn{background:#f4eddc;color:#8b6e2f}.status.danger{background:#f8e6e4;color:#a84f49}
.cart-line{display:grid;grid-template-columns:70px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border-bottom:0}.thumb{width:64px;height:64px;border-radius:14px;background:#eee8de;display:grid;place-items:center;font-size:34px}.qty{display:flex;gap:7px;align-items:center}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff}
.login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#f6f3ee}.login-art{background:linear-gradient(135deg,#111 0%,#2b2924 50%,#a0874d 120%);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.login-art:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#c7ad6b 0%,rgba(199,173,107,0) 67%);right:-180px;top:-150px;opacity:.45}.login-art h1{font-size:56px;max-width:620px}.login-panel{display:grid;place-items:center;padding:40px}.login-card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow)}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.mode-switch{display:flex;gap:10px;background:#ece6db;padding:5px;border-radius:14px}.mode-switch button{border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:800}.mode-switch button.active{background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.role-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:left}.role-card.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(165,138,74,.15)}.role-card b{display:block}.role-card span{font-size:11px;color:var(--muted)}.demo-note{background:#f9f6f0;border:1px dashed #cdbf9f;border-radius:14px;padding:13px;margin:14px 0;font-size:12px}.rve-badge{display:inline-flex;align-items:center;gap:8px;background:#111;color:#e6cd91;padding:7px 10px;border-radius:10px;font-weight:900;letter-spacing:.04em}.logout{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:800}.login-card{max-width:520px}.login-card .field input{width:100%}.login-role-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.login-role-title small{color:var(--muted)}
.order-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.flow-step{background:#151618;color:#fff;border-radius:18px;padding:20px;position:relative}.flow-step b{display:block;margin-top:12px}.flow-step small{color:#c9c7c2}.flow-no{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900}
.footer{background:#101214;color:#fff;padding:32px 24px;margin-top:56px}.footer-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:30px;align-items:center}.footer .logo-box{font-size:20px}
.toast{position:fixed;right:22px;bottom:22px;background:#111;color:#fff;padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:100;animation:pop .25s ease}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}.hero-art{display:none}.feature-strip,.grid.cols-4,.grid.cols-3,.product-grid{grid-template-columns:repeat(2,1fr)}.app-shell{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto;display:flex;overflow:auto}.side-logo,.side-foot{display:none}.side-nav{display:flex;gap:6px}.side-nav button{white-space:nowrap}.login-page{grid-template-columns:1fr}.login-art{min-height:330px}.order-flow{grid-template-columns:1fr 1fr}.content{padding:20px}}
@media(max-width:640px){.topbar-inner{padding:14px 16px}.nav{display:none}.container{padding:18px 14px 50px}.hero-copy{padding:42px 28px}.feature-strip,.grid.cols-2,.grid.cols-3,.grid.cols-4,.product-grid,.order-flow{grid-template-columns:1fr}.content-head{align-items:flex-start;flex-direction:column}.cart-line{grid-template-columns:56px 1fr}.cart-line .qty,.cart-line .price{grid-column:2}.login-art{padding:34px 26px}.login-art h1{font-size:42px}.login-panel{padding:22px}.app-shell{display:block}.sidebar{padding:10px}.content{padding:16px}.footer-inner{flex-direction:column;align-items:flex-start}}

</style>
</head>
<body>
  <div id="app"></div>
  <script>
const state={
  route:'landing', mode:'employee', loginRole:'employee', points:220,
  user:{name:'Sanne de Vries',role:'Facilitair medewerker',location:'Amersfoort',sizes:'Boven L · Broek 40 · Schoen 43'},
  cart:[],
  products:[
    {id:1,name:'Facility Polo',points:15,cat:'Werkkleding',icon:'👕',size:'L'},
    {id:2,name:'Softshell jas',points:35,cat:'Werkkleding',icon:'🧥',size:'L'},
    {id:3,name:'Werkbroek',points:25,cat:'Werkkleding',icon:'👖',size:'40'},
    {id:4,name:'Veiligheidsschoenen S3',points:45,cat:'PBM',icon:'🥾',size:'43'},
    {id:5,name:'Werkhandschoenen',points:10,cat:'PBM',icon:'🧤',size:'L'},
    {id:6,name:'Veiligheidshelm',points:20,cat:'PBM',icon:'⛑️',size:'One size'},
    {id:7,name:'Sweater',points:20,cat:'Werkkleding',icon:'🧶',size:'L'},
    {id:8,name:'Regenjas',points:40,cat:'Werkkleding',icon:'🌧️',size:'L'},
    {id:9,name:'Bodywarmer',points:30,cat:'Werkkleding',icon:'🦺',size:'L'}
  ]
}
const app=document.querySelector('#app');
const money=n=>'€ '+n.toLocaleString('nl-NL');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function go(route){state.route=route;render();window.scrollTo({top:0,behavior:'smooth'})}
function logo(){return `<div class="logo-box">FACILITY.</div>`}
function topbar(){const logged=['employee','hr','rve'].includes(state.mode)&&!['landing','login','how'].includes(state.route);return `<div class="topbar"><div class="topbar-inner"><div class="brand">${state.mode==='rve'?'<div class="logo-box">RVE</div>':logo()}<small>${state.mode==='rve'?'Centraal beheer':'Werkkleding & tools'}</small></div><div class="nav">${logged?'':`<button onclick="go('landing')">Home</button><button onclick="go('how')">Hoe het werkt</button>`}${logged?`<button class="logout" onclick="logout()">Uitloggen</button>`:`<button class="btn primary" onclick="go('login')">Inloggen</button>`}</div></div></div>`}
function landing(){return `<div class="shell">${topbar()}<main class="container"><section class="hero"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">Facility medewerkersomgeving</div><h1>Jouw werkkleding, jouw omgeving.</h1><p>Bestel eenvoudig goedgekeurde bedrijfskleding en PBM's, vraag gereedschap aan en houd zelf inzicht in je persoonlijke budget en bestellingen.</p><div class="hero-actions"><button class="btn primary" onclick="go('login')">Naar mijn omgeving →</button><button class="btn outline" onclick="go('how')">Bekijk hoe het werkt</button></div></div><div class="hero-art"><div class="person-card"></div><div class="hero-tag">Samen voor een schone, veilige en fijne werkomgeving.</div></div></div></section><div class="feature-strip"><div class="feature"><div class="ico">👕</div><div><b>Werkkleding</b><span>Representatief en comfortabel</span></div></div><div class="feature"><div class="ico">⛑️</div><div><b>PBM's</b><span>Veilig aan het werk</span></div></div><div class="feature"><div class="ico">🛠️</div><div><b>Gereedschap</b><span>Aanvragen en beheren</span></div></div><div class="feature"><div class="ico">👤</div><div><b>Persoonlijk</b><span>Budget, maten en orders</span></div></div></div><div class="section-title"><div><h2>Alles in één Facility-omgeving</h2><p>RVE beheert achter de schermen het assortiment, de orders en fulfilment.</p></div></div><div class="grid cols-3"><div class="card"><h3>Persoonlijk assortiment</h3><p class="muted">Medewerkers zien alleen artikelen die bij hun functie en locatie horen.</p></div><div class="card"><h3>Budget & punten</h3><p class="muted">Facility stelt budgetten in; medewerkers zien direct wat nog beschikbaar is.</p></div><div class="card"><h3>Order naar RVE</h3><p class="muted">Na bestellen komt de order direct in het centrale RVE-ordercentrum terecht.</p></div></div></main>${footer()}</div>`}
function selectRole(role){state.loginRole=role;render()}
function demoCreds(role){return role==='employee'?{email:'medewerker@facility.nl',pass:'demo1234'}:role==='hr'?{email:'hr@facility.nl',pass:'demo1234'}:{email:'beheer@rve.nl',pass:'demo1234'}}
function doLogin(){const email=(document.getElementById('loginEmail')||{}).value||'';const pass=(document.getElementById('loginPassword')||{}).value||'';const c=demoCreds(state.loginRole);if(email.trim().toLowerCase()!==c.email||pass!==c.pass){toast('Gebruik de demo-inloggegevens die op het scherm staan');return}if(state.loginRole==='employee'){state.mode='employee';go('dashboard')}else if(state.loginRole==='hr'){state.mode='hr';go('admin')}else{state.mode='rve';go('rve')}}
function logout(){state.mode='employee';state.loginRole='employee';state.route='landing';render();window.scrollTo({top:0,behavior:'smooth'})}
function login(){const c=demoCreds(state.loginRole);const meta=state.loginRole==='employee'?['Medewerker','Bestellen, punten, maten en eigen orders']:state.loginRole==='hr'?['Facility HR / beheer','Medewerkers, budgetten, assortiment en goedkeuringen']:['RVE Bedrijfskleding','Alle klantorders, voorraad, fulfilment en facturatie'];return `<div class="login-page"><section class="login-art"><div>${logo()}<h1>Drie rollen. Eén platform.</h1><p>Facility-medewerkers bestellen in hun eigen huisstijl. HR houdt de controle. RVE verwerkt alles centraal.</p></div><div><div class="rve-badge">RVE BEDRIJFSKLEDING</div><div class="mini" style="margin-top:10px;color:#d7d2c8">White-label klantomgeving · centrale orderverwerking</div></div></section><section class="login-panel"><div class="login-card"><div class="login-role-title"><div><h2 style="margin-bottom:4px">Inloggen</h2><small>Kies eerst jouw rol</small></div><span class="status">DEMO</span></div><div class="role-grid"><button class="role-card ${state.loginRole==='employee'?'active':''}" onclick="selectRole('employee')"><b>👤 Medewerker</b><span>Persoonlijke omgeving</span></button><button class="role-card ${state.loginRole==='hr'?'active':''}" onclick="selectRole('hr')"><b>👥 Facility HR</b><span>Klantbeheer</span></button><button class="role-card ${state.loginRole==='rve'?'active':''}" onclick="selectRole('rve')"><b>◆ RVE beheer</b><span>Jouw centrale omgeving</span></button></div><h3 style="margin:12px 0 2px">${meta[0]}</h3><p class="muted" style="margin-top:4px">${meta[1]}</p><div class="field"><label>E-mailadres</label><input id="loginEmail" value="${c.email}" autocomplete="username"></div><div class="field"><label>Wachtwoord</label><input id="loginPassword" type="password" value="${c.pass}" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div><div class="demo-note"><b>Demo-inlog</b><br>${c.email}<br>Wachtwoord: <b>${c.pass}</b></div><button class="btn ${state.loginRole==='rve'?'dark':'primary'}" style="width:100%" onclick="doLogin()">Inloggen als ${meta[0]} →</button><button class="ghost" style="width:100%;margin-top:8px" onclick="go('landing')">← Terug naar website</button></div></section></div>`}
function sidebar(active){let items;if(state.mode==='rve'){items=[['rve','RVE dashboard','◫'],['rveorders','Alle orders','📦'],['rvecustomers','Klanten','🏢'],['catalog','Productcatalogus','👕'],['rvestock','Voorraad','▦'],['tools','Assets / tools','🛠️'],['rvebilling','Facturatie','€']]}else if(state.mode==='hr'){items=[['admin','Dashboard','◫'],['employees','Medewerkers','👥'],['catalog','Assortiment','👕'],['orders','Bestellingen','📦'],['approvals','Goedkeuringen','✓'],['tools','Gereedschap','🛠️'],['reports','Rapportages','📊']]}else{items=[['dashboard','Dashboard','◫'],['catalog','Werkkleding','👕'],['catalog','PBM’s','⛑️'],['tools','Gereedschap','🛠️'],['orders','Mijn bestellingen','📦'],['profile','Mijn profiel','👤']]};return `<aside class="sidebar"><div class="side-logo">${state.mode==='rve'?'<div class="logo-box">RVE</div>':logo()}</div><div class="side-nav">${items.map(i=>`<button class="${active===i[0]?'active':''}" onclick="go('${i[0]}')"><span>${i[2]}</span>${i[1]}</button>`).join('')}</div><div class="side-foot">${state.mode==='rve'?'Centraal platform van <b>RVE Bedrijfskleding</b>':'Powered & fulfilled by <b>RVE Bedrijfskleding</b>'}</div></aside>`}
function appFrame(active,content,title){const who=state.mode==='rve'?{eyebrow:'RVE super admin',initials:'RV',name:'RVE Beheerder',sub:'Alle klantomgevingen'}:state.mode==='hr'?{eyebrow:'Facility HR / beheer',initials:'HR',name:'Facility HR',sub:'HR / Inkoop / Facility'}:{eyebrow:'Medewerkersomgeving',initials:'SD',name:state.user.name,sub:state.user.role};return `<div class="shell">${topbar()}<div class="app-shell">${sidebar(active)}<main class="content"><div class="content-head"><div><div class="eyebrow">${who.eyebrow}</div><h2>${title}</h2></div><div class="user-chip"><div class="avatar">${who.initials}</div><div><b>${who.name}</b><div class="mini">${who.sub}</div></div></div></div>${content}</main></div></div>`}
function dashboard(){const recent=state.cart.length;return appFrame('dashboard',`<div class="grid cols-4"><div class="card"><div class="label">Jouw budget</div><div class="kpi">${state.points}</div><div class="mini">van 300 punten beschikbaar</div><div class="progress"><span style="width:${Math.min(100,state.points/3)}%"></span></div></div><div class="card"><div class="label">Openstaande orders</div><div class="kpi">2</div><div class="mini">1 wordt verwerkt door RVE</div></div><div class="card"><div class="label">Gereedschap op naam</div><div class="kpi">3</div><div class="mini">Alle assets zijn actief</div></div><div class="card"><div class="label">Nieuwe meldingen</div><div class="kpi">${recent}</div><div class="mini">Actuele winkelwagenitems</div></div></div><div class="section-title"><div><h2>Goedemorgen Sanne</h2><p>${state.user.role} · ${state.user.location}</p></div></div><div class="grid cols-3"><div class="card"><h3>👕 Werkkleding</h3><p class="muted">Polo's, jassen, broeken en meer.</p><button class="btn outline" onclick="go('catalog')">Bekijken</button></div><div class="card"><h3>⛑️ PBM's</h3><p class="muted">Veilig werken begint met de juiste middelen.</p><button class="btn outline" onclick="go('catalog')">Bekijken</button></div><div class="card"><h3>🛠️ Gereedschap</h3><p class="muted">Aanvragen en inzien wat aan jou is uitgegeven.</p><button class="btn outline" onclick="go('tools')">Bekijken</button></div></div><div class="section-title"><div><h2>Voor jou geselecteerd</h2><p>Op basis van je functie en persoonlijke maten.</p></div></div>${productCards(state.products.slice(0,3))}`, 'Mijn dashboard')}
function productCards(list){return `<div class="product-grid">${list.map(p=>`<div class="product"><div class="product-img">${p.icon}</div><div><div class="mini">${p.cat}</div><h4>${p.name}</h4><div class="mini">Maat ${p.size}</div></div><div class="row"><span class="price">${p.points} punten</span><button class="btn primary" onclick="addToCart(${p.id})">Bestellen</button></div></div>`).join('')}</div>`}
function catalog(){return appFrame('catalog',`<div class="card" style="margin-bottom:18px"><div class="grid cols-3"><div><div class="label">Assortiment</div><h3>Alleen voor jouw functie</h3></div><div class="field" style="margin:0"><label>Categorie</label><select id="cat" onchange="filterCat(this.value)"><option>Alles</option><option>Werkkleding</option><option>PBM</option></select></div><div class="field" style="margin:0"><label>Zoeken</label><input id="search" placeholder="Zoek artikel..." oninput="filterSearch(this.value)"></div></div></div><div id="products">${productCards(state.products)}</div><div class="card" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><div><b>${state.cart.reduce((a,b)=>a+b.qty,0)} artikelen in je winkelwagen</b><div class="mini">Totaal ${state.cart.reduce((a,b)=>a+b.points*b.qty,0)} punten</div></div><button class="btn dark" onclick="go('cart')">Naar winkelwagen →</button></div>`, 'Assortiment')}
function filterCat(cat){document.querySelector('#products').innerHTML=productCards(cat==='Alles'?state.products:state.products.filter(p=>p.cat===cat))}
function filterSearch(q){const v=q.toLowerCase();document.querySelector('#products').innerHTML=productCards(state.products.filter(p=>p.name.toLowerCase().includes(v)))}
function addToCart(id){const p=state.products.find(x=>x.id===id),ex=state.cart.find(x=>x.id===id);ex?ex.qty++:state.cart.push({...p,qty:1});toast(`${p.name} toegevoegd`);}
function cart(){const total=state.cart.reduce((a,b)=>a+b.points*b.qty,0);return appFrame('catalog',`<div class="grid cols-2"><div class="card"><h3>Mijn bestelling</h3>${state.cart.length?state.cart.map(p=>`<div class="cart-line"><div class="thumb">${p.icon}</div><div><b>${p.name}</b><div class="mini">Maat ${p.size}</div></div><div class="qty"><button onclick="qty(${p.id},-1)">−</button><b>${p.qty}</b><button onclick="qty(${p.id},1)">+</button></div><div class="price">${p.points*p.qty} pt</div></div>`).join(''):'<p class="muted">Je winkelwagen is nog leeg.</p>'}</div><div class="card"><h3>Samenvatting</h3><div class="row"><span>Huidig budget</span><b>${state.points} punten</b></div><div class="row"><span>Deze bestelling</span><b>${total} punten</b></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="row"><span>Resterend</span><span class="kpi" style="font-size:28px">${state.points-total}</span></div><button class="btn primary" style="width:100%;margin-top:18px" ${!state.cart.length?'disabled':''} onclick="checkout()">Bestelling plaatsen →</button><p class="mini">Na plaatsen gaat de order rechtstreeks naar RVE Bedrijfskleding voor verwerking.</p></div></div>`, 'Winkelwagen')}
function qty(id,d){const p=state.cart.find(x=>x.id===id);if(!p)return;p.qty+=d;if(p.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);render()}
function checkout(){const total=state.cart.reduce((a,b)=>a+b.points*b.qty,0);if(total>state.points){toast('Onvoldoende punten');return}state.points-=total;state.cart=[];toast('Bestelling doorgestuurd naar RVE');go('orders')}
function orders(){return appFrame('orders',`<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Datum</th><th>Artikelen</th><th>Status</th><th>Verwerking</th></tr></thead><tbody><tr><td><b>#FAC-10582</b></td><td>12-01-2026</td><td>Polo, werkbroek, schoenen</td><td><span class="status">Verzonden</span></td><td>RVE Bedrijfskleding</td></tr><tr><td><b>#FAC-10579</b></td><td>08-01-2026</td><td>Softshell jas</td><td><span class="status warn">In verwerking</span></td><td>RVE Bedrijfskleding</td></tr><tr><td><b>#FAC-10571</b></td><td>04-01-2026</td><td>Handschoenen</td><td><span class="status">Geleverd</span></td><td>RVE Bedrijfskleding</td></tr></tbody></table></div>`, state.mode==='hr'?'Bestellingen':state.mode==='rve'?'Alle bestellingen':'Mijn bestellingen')}
function tools(){const rows=[['Accuboormachine 18V','FAC-00481','In gebruik','Sanne de Vries'],['Multimeter','FAC-00192','In gebruik','Jan Jansen'],['Gereedschapskoffer','FAC-00321','Op voorraad','—'],['Zaklamp','FAC-00711','In gebruik','Peter Bakker'],['Steekwagen','FAC-00832','Ter reparatie','—']];return appFrame('tools',`<div class="grid cols-4"><div class="card"><div class="label">Alle tools</div><div class="kpi">184</div></div><div class="card"><div class="label">In gebruik</div><div class="kpi">142</div></div><div class="card"><div class="label">Op voorraad</div><div class="kpi">29</div></div><div class="card"><div class="label">Ter reparatie</div><div class="kpi">8</div></div></div><div class="section-title"><div><h2>Gereedschap</h2><p>Uitgifte, aanvragen en assetregistratie.</p></div><button class="btn primary" onclick="toast('Nieuwe gereedschapsaanvraag gestart')">+ Aanvragen</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Assetnummer</th><th>Status</th><th>Medewerker</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="status ${r[2]==='Ter reparatie'?'danger':r[2]==='Op voorraad'?'warn':''}">${r[2]}</span></td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`, 'Gereedschap')}

function how(){return `<div class="shell">${topbar()}<main class="container"><div class="section-title"><div><div class="eyebrow">Facility × RVE</div><h2>Van bestelling tot levering</h2><p>De medewerker bestelt in Facility-huisstijl. RVE verzorgt de uitvoering.</p></div></div>${flow()}<div class="section-title"><div><h2>Wie doet wat?</h2></div></div><div class="grid cols-3"><div class="card"><h3>Facility</h3><p class="muted">Beheert medewerkers, functies, budgetten, assortimentrechten en goedkeuringen.</p></div><div class="card"><h3>Medewerker</h3><p class="muted">Bestelt goedgekeurde kleding/PBM en vraagt gereedschap aan.</p></div><div class="card"><h3>RVE Bedrijfskleding</h3><p class="muted">Ontvangt orders, beheert producten/voorraad, personaliseert, verpakt, verzendt en factureert.</p></div></div><div style="margin-top:28px"><button class="btn dark" onclick="go('login')">Open demo →</button></div></main>${footer()}</div>`}
function flow(){return `<div class="order-flow"><div class="flow-step"><div class="flow-no">1</div><b>Medewerker bestelt</b><small>Via de Facility omgeving</small></div><div class="flow-step"><div class="flow-no">2</div><b>Order naar RVE</b><small>Automatisch in ordercentrum</small></div><div class="flow-step"><div class="flow-no">3</div><b>Verwerking</b><small>Voorraad, bedrukken, verpakken</small></div><div class="flow-step"><div class="flow-no">4</div><b>Verzending</b><small>Naar medewerker of locatie</small></div><div class="flow-step"><div class="flow-no">5</div><b>Levering</b><small>Status terug in Facility</small></div></div>`}
function footer(){return `<footer class="footer"><div class="footer-inner"><div class="brand">${logo()}<span>×</span><div class="logo-box">RVE</div></div><div><b>Mogelijk gemaakt door RVE Bedrijfskleding</b><div class="mini">Partner voor bedrijfskleding, PBM's en gereedschap.</div></div></div></footer>`}
function render(){switch(state.route){case'landing':app.innerHTML=landing();break;case'login':app.innerHTML=login();break;case'dashboard':state.mode='employee';app.innerHTML=dashboard();break;case'catalog':app.innerHTML=catalog();break;case'cart':app.innerHTML=cart();break;case'orders':app.innerHTML=orders();break;case'tools':app.innerHTML=tools();break;case'profile':app.innerHTML=profile();break;case'admin':if(state.mode!=='rve')state.mode='hr';app.innerHTML=admin();break;case'employees':state.mode='hr';app.innerHTML=employees();break;case'approval':case'approvals':state.mode='hr';app.innerHTML=approvals();break;case'reports':state.mode='hr';app.innerHTML=reports();break;case'rve':state.mode='rve';app.innerHTML=rveDashboard();break;case'rveorders':state.mode='rve';app.innerHTML=rveOrders();break;case'rvecustomers':state.mode='rve';app.innerHTML=rveCustomers();break;case'rvestock':state.mode='rve';app.innerHTML=rveStock();break;case'rvebilling':state.mode='rve';app.innerHTML=rveBilling();break;case'how':app.innerHTML=how();break;default:app.innerHTML=landing()}}
window.go=go;window.addToCart=addToCart;window.qty=qty;window.checkout=checkout;window.filterCat=filterCat;window.filterSearch=filterSearch;window.toast=toast;window.selectRole=selectRole;window.doLogin=doLogin;window.logout=logout;
render();

</script>
</body>
</html>
